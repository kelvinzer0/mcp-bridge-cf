<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #00d4ff;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      background: #16213e;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot.disconnected { background: #ff4444; }
    .dot.connecting { background: #ffaa00; animation: pulse 1s infinite; }
    .dot.connected { background: #44ff44; }
    @keyframes pulse { 50% { opacity: 0.3; } }
    input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #16213e;
      color: #e0e0e0;
      font-size: 13px;
      margin-bottom: 8px;
    }
    input:focus { outline: none; border-color: #00d4ff; }
    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 6px;
    }
    #connectBtn {
      background: #00d4ff;
      color: #000;
      font-weight: 600;
    }
    #connectBtn:hover { background: #00b8d9; }
    #disconnectBtn {
      background: #333;
      color: #e0e0e0;
    }
    #disconnectBtn:hover { background: #444; }
    .tools {
      margin-top: 12px;
      padding: 8px 12px;
      background: #16213e;
      border-radius: 6px;
      max-height: 200px;
      overflow-y: auto;
    }
    .tools h2 {
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .tool-item {
      padding: 4px 0;
      font-size: 12px;
      border-bottom: 1px solid #222;
    }
    .tool-item:last-child { border-bottom: none; }
    .tool-name { color: #00d4ff; font-family: monospace; }
    .mcp-url {
      margin-top: 12px;
      padding: 8px 12px;
      background: #16213e;
      border-radius: 6px;
      font-size: 11px;
      word-break: break-all;
      color: #888;
    }
    .mcp-url code {
      color: #44ff44;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <h1>🌉 MCP Bridge</h1>

  <div class="status">
    <div class="dot disconnected" id="dot"></div>
    <span id="statusText">Disconnected</span>
  </div>

  <input type="text" id="urlInput" placeholder="https://mcp-bridge.your-subdomain.workers.dev" />
  <button id="connectBtn">Connect</button>
  <button id="disconnectBtn" style="display:none">Disconnect</button>

  <div class="tools" id="toolsSection" style="display:none">
    <h2>Registered Tools (<span id="toolCount">0</span>)</h2>
    <div id="toolList"></div>
  </div>

  <div class="mcp-url" id="mcpUrl" style="display:none">
    MCP endpoint:<br>
    <code id="mcpEndpoint"></code>
  </div>

  <script src="popup.js"></script>
</body>
</html>
